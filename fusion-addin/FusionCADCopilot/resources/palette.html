<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Copilot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: #252526;
            padding: 15px;
            border-bottom: 1px solid #3c3c3c;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status {
            font-size: 12px;
            color: #858585;
        }

        /* Chat area */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 10px 12px;
            border-radius: 8px;
            max-width: 85%;
            word-wrap: break-word;
        }

        .user {
            background: #094771;
            align-self: flex-end;
            border: 1px solid #0e639c;
        }

        .ai {
            background: #1a472a;
            align-self: flex-start;
            border: 1px solid #2ea043;
        }

        .system {
            background: #3c3c3c;
            align-self: center;
            text-align: center;
            font-size: 12px;
            color: #858585;
        }

        .error {
            background: #5a1d1d;
            align-self: flex-start;
            border: 1px solid #f85149;
            color: #f85149;
        }

        /* Code display */
        .code-block {
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            padding: 12px;
            margin-top: 8px;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            white-space: pre;
        }

        .code-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .code-actions button {
            flex: 1;
            padding: 6px 12px;
            border: 1px solid #3c3c3c;
            background: #2d2d30;
            color: #d4d4d4;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .code-actions button:hover {
            background: #3c3c3c;
        }

        .code-actions button.primary {
            background: #0e639c;
            border-color: #1177bb;
        }

        .code-actions button.primary:hover {
            background: #1177bb;
        }

        /* Loading spinner */
        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #858585;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #3c3c3c;
            border-top-color: #858585;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Quick templates */
        .templates {
            padding: 10px 15px;
            background: #252526;
            border-bottom: 1px solid #3c3c3c;
        }

        .templates-title {
            font-size: 11px;
            color: #858585;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .template-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .template-btn {
            padding: 4px 10px;
            font-size: 11px;
            background: #2d2d30;
            border: 1px solid #3c3c3c;
            color: #d4d4d4;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .template-btn:hover {
            background: #3c3c3c;
            border-color: #0e639c;
        }

        /* Input area */
        .input-area {
            padding: 15px;
            background: #252526;
            border-top: 1px solid #3c3c3c;
        }

        #input {
            width: 100%;
            padding: 10px;
            border: 1px solid #3c3c3c;
            background: #3c3c3c;
            color: #d4d4d4;
            border-radius: 6px;
            font-size: 13px;
            resize: vertical;
            min-height: 40px;
            font-family: inherit;
        }

        #input:focus {
            outline: none;
            border-color: #0e639c;
        }

        .input-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        #send {
            flex: 1;
            padding: 10px 20px;
            background: #0e639c;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
        }

        #send:hover {
            background: #1177bb;
        }

        #send:disabled {
            background: #3c3c3c;
            color: #858585;
            cursor: not-allowed;
        }

        #clear {
            padding: 10px 16px;
            background: #2d2d30;
            border: 1px solid #3c3c3c;
            color: #d4d4d4;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        #clear:hover {
            background: #3c3c3c;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #3c3c3c;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4c4c4c;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>
            <span>🤖</span>
            CAD Copilot
        </h1>
        <div class="status" id="status">Ready</div>
    </div>

    <!-- Quick Templates -->
    <div class="templates">
        <div class="templates-title">Quick Start</div>
        <div class="template-buttons">
            <button class="template-btn" onclick="useTemplate('Create a 50mm cube')">Cube</button>
            <button class="template-btn" onclick="useTemplate('Create a cylinder, 30mm diameter, 50mm height')">Cylinder</button>
            <button class="template-btn" onclick="useTemplate('Create a sphere with 25mm radius')">Sphere</button>
            <button class="template-btn" onclick="useTemplate('Create a mounting bracket, 80x50x10mm, with 4 M6 holes in corners')">Bracket</button>
        </div>
    </div>

    <!-- Chat area -->
    <div id="chat"></div>

    <!-- Input area -->
    <div class="input-area">
        <textarea id="input" placeholder="Describe what you want to build..."></textarea>
        <div class="input-buttons">
            <button id="send">Generate</button>
            <button id="clear">Clear</button>
        </div>
    </div>

    <script>
        // DOM elements
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const send = document.getElementById('send');
        const clear = document.getElementById('clear');
        const status = document.getElementById('status');

        let currentCode = '';

        // Event listeners
        send.addEventListener('click', sendMessage);
        clear.addEventListener('click', clearChat);

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
                sendMessage();
            }
        });

        // Send message to backend
        function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addMessage('user', text);
            input.value = '';

            // Disable send button
            send.disabled = true;
            send.textContent = 'Generating...';

            // Send to Python backend via Fusion API
            const data = {
                action: 'generate',
                message: text
            };
            window.adsk.fusionSendData('generate', JSON.stringify(data));
        }

        // Use template
        function useTemplate(text) {
            input.value = text;
            input.focus();
        }

        // Clear conversation
        function clearChat() {
            if (confirm('Clear conversation history?')) {
                chat.innerHTML = '';
                currentCode = '';

                // Tell Python to clear conversation
                const data = { action: 'clear' };
                window.adsk.fusionSendData('clear', JSON.stringify(data));

                addMessage('system', 'Conversation cleared');
            }
        }

        // Add message to chat
        function addMessage(type, text) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            chat.appendChild(msg);
            scrollToBottom();
        }

        // Show code with execute button
        function showCode(code) {
            currentCode = code;

            const codeContainer = document.createElement('div');
            codeContainer.className = 'message ai';

            const codeBlock = document.createElement('div');
            codeBlock.className = 'code-block';
            codeBlock.textContent = code;

            const actions = document.createElement('div');
            actions.className = 'code-actions';

            const executeBtn = document.createElement('button');
            executeBtn.className = 'primary';
            executeBtn.textContent = '▶ Execute';
            executeBtn.onclick = () => executeCode(code);

            const copyBtn = document.createElement('button');
            copyBtn.textContent = '📋 Copy';
            copyBtn.onclick = () => copyCode(code);

            actions.appendChild(executeBtn);
            actions.appendChild(copyBtn);

            codeContainer.appendChild(codeBlock);
            codeContainer.appendChild(actions);

            chat.appendChild(codeContainer);
            scrollToBottom();
        }

        // Execute code
        function executeCode(code) {
            const data = {
                action: 'execute',
                code: code
            };
            window.adsk.fusionSendData('execute', JSON.stringify(data));
            status.textContent = 'Executing...';
        }

        // Copy code to clipboard
        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                status.textContent = 'Code copied!';
                setTimeout(() => status.textContent = 'Ready', 2000);
            });
        }

        // Show loading
        function showLoading(message) {
            const loading = document.createElement('div');
            loading.className = 'message loading';
            loading.innerHTML = `
                <div class="spinner"></div>
                <span>${message}</span>
            `;
            chat.appendChild(loading);
            scrollToBottom();
        }

        // Scroll to bottom
        function scrollToBottom() {
            chat.scrollTop = chat.scrollHeight;
        }

        // Handle messages from Python
        window.fusionJavaScriptHandler = {
            handle: function(action, data) {
                // Re-enable send button
                send.disabled = false;
                send.textContent = 'Generate';

                switch(action) {
                    case 'code':
                        showCode(data);
                        break;

                    case 'success':
                        addMessage('system', data);
                        status.textContent = 'Success!';
                        setTimeout(() => status.textContent = 'Ready', 2000);
                        break;

                    case 'error':
                        addMessage('error', data);
                        status.textContent = 'Error';
                        setTimeout(() => status.textContent = 'Ready', 3000);
                        break;

                    case 'loading':
                        showLoading(data);
                        status.textContent = data;
                        break;

                    case 'status':
                        addMessage('system', data);
                        status.textContent = 'Ready';
                        break;

                    default:
                        console.log('Unknown action:', action, data);
                }
            }
        };

        // Initial message
        addMessage('system', 'CAD Copilot ready! Describe what you want to build.');
    </script>
</body>
</html>
